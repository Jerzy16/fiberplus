<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * blob: data:; media-src * blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' blob:; worker-src blob: 'self'; img-src * data: blob:; connect-src *;">
  <title>FiberPlus</title>
  <meta name="description" content="Proyect IPTV">
  <link rel="icon" href="icon.svg" sizes="256x256">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <!-- Loaded last: it only re-points the layout tokens declared above. -->
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app"></div>

  <script src="js/vendor/hls.min.js"></script>

  <script>
    if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
      var backendOrigin = window.location.port === '8080'
        ? ''
        : (window.location.protocol + '//' + window.location.hostname + ':8080');
      window.__IPTV_BACKEND_ORIGIN__ = backendOrigin || window.location.origin;
      window.__IPTV_PROXY_URL__ = backendOrigin + '/api/proxy?url=';
      window.__IPTV_TRANSCODER_URL__ = backendOrigin + '/api/transcode?url=';
      window.__IPTV_BACKEND_ORIGIN__ = window.location.origin;
      window.__IPTV_TRANSCODER_URL__ = window.location.origin + '/api/transcode?url=';
      window.__IPTV_PROXY_URL__ = window.location.origin + '/api/proxy?url=';
    }
  </script>

  <script src="js/core/utils.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/keyboard.js"></script>
  <script src="js/core/spatial-nav.js"></script>

  <script src="js/services/m3u-parser.js"></script>
  <script src="js/services/providers.js"></script>
  <script src="js/services/iptv-service.js"></script>
  <script src="js/services/auth-service.js"></script>
  <script src="js/services/video-engine.js"></script>

  <script src="js/components/icons.js"></script>
  <script src="js/components/channel-card.js"></script>
  <script src="js/components/logo-loader.js"></script>
  <script src="js/components/channel-rail.js"></script>
  <script src="js/components/provider-card.js"></script>
  <script src="js/components/state-message.js"></script>

  <script src="js/pages/splash-page.js"></script>
  <script src="js/pages/login-page.js"></script>
  <script src="js/pages/home-page.js"></script>
  <script src="js/pages/player-page.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
